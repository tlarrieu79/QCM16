<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#12233d;--mute:#5b6b82;--line:#d5dde8;--main:#0b3d91;--on:#fff;--ok:#1a7f4b;--ko:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0d1626;--card:#16233a;--ink:#e8eef8;--mute:#9bacc4;--line:#2a3b57;--main:#5b9bff;--on:#08142a;--ok:#5fd08e;--ko:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:720px;margin:0 auto;padding:18px 16px 40px}h1{font-size:1.9rem;line-height:1.1;margin:6px 0;font-weight:800}h2{font-size:1.2rem;margin:16px 0 10px}p{margin:0 0 12px}
.mute{color:var(--mute)}.sm{font-size:.85rem}button,input,textarea,select{font:inherit;color:inherit}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:var(--main);color:var(--on);font-weight:700;cursor:pointer;margin-top:8px}
.btn.alt{background:transparent;color:var(--main);border:2px solid var(--main)}.btn.del{background:transparent;color:var(--ko);border:2px solid var(--ko)}
.btn.s{display:inline-block;width:auto;padding:8px 14px;margin:4px 6px 0 0}.btn:disabled{opacity:.4}
:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;padding:10px;border-radius:8px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.tabs button[aria-current="true"]{background:var(--main);color:var(--on);border-color:var(--main)}
input,textarea,select{width:100%;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);margin:4px 0 10px}
input[type=checkbox]{width:24px;height:24px;margin:0;flex:none;accent-color:var(--main)}.ans{display:flex;gap:10px;align-items:center;margin-bottom:8px}.ans input[type=text]{margin:0}
.x{width:auto;flex:none;padding:8px 12px;border:2px solid var(--line);border-radius:8px;background:transparent;color:var(--ko);cursor:pointer}
label{font-size:.85rem;color:var(--mute)}details summary{cursor:pointer;color:var(--main);margin:6px 0 10px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px;cursor:pointer}.opt.sel{border-color:var(--main)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--main)}
.score{font-size:3rem;font-weight:800;line-height:1}.pre{white-space:pre-wrap}.code{font-size:1.7rem;letter-spacing:.2em;font-weight:800;color:var(--main)}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.qr svg{width:100%;height:auto;display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bigin{font-size:1.8rem;text-align:center;letter-spacing:.3em;text-transform:uppercase}
</style>
</head>
<body>
<main id="app"><p>Chargement…</p></main>
<script>
const SB_URL=((window.CFG||{}).url||"").trim(),SB_KEY=((window.CFG||{}).key||"").trim();
const MEM={};
const S={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return MEM[k]||null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){MEM[k]=v}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){delete MEM[k]}}};
const fail=t=>{document.getElementById("app").innerHTML=`<h1>Le site ne démarre pas</h1><div class="card"><p>${t}</p></div>`};
window.addEventListener("error",e=>{if(!document.getElementById("app").innerHTML.trim())fail("Erreur : "+e.message)});
const bad=t=>String(t).replace(/[<&]/g,"");
let sb=null;
if(!window.CFG)fail("Le bloc de configuration est illisible (guillemets manquants ?).");
else if(/COLLEZ_ICI/.test(SB_URL+SB_KEY))fail("L'adresse et la clé Supabase n'ont pas été remplacées dans index.html.");
else if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(SB_URL))fail("Adresse lue : <b>"+bad(SB_URL)+"</b>.<br>Elle doit ressembler à https://abcdefgh.supabase.co (Project Settings &gt; API &gt; Project URL), et non à l'adresse du tableau de bord Supabase.");
else if(SB_KEY.length<40)fail("La clé lue fait seulement "+SB_KEY.length+" caractères : elle semble incomplète. Copiez la clé « anon public » en entier.");
else if(typeof supabase=="undefined")fail("La bibliothèque Supabase n'a pas pu se charger (connexion ou blocage du réseau, par exemple un filtre d'entreprise ou une extension de blocage).");
else try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){fail("Adresse ou clé Supabase invalide : "+e.message)}
const $=s=>document.querySelector(s),app=$("#app");
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=t=>new Date(t).toLocaleDateString("fr-FR");
const ERR={code_invalide:"Code inconnu. Vérifiez-le auprès de votre formateur.",deja_demarre:"Ce QCM a déjà démarré : vous ne pouvez plus le rejoindre.",nom_invalide:"Indiquez votre prénom et votre nom.",pas_demarre:"Le QCM n'a pas encore démarré.",deja_termine:"Vous avez déjà terminé ce QCM."};
const rpc=async(n,a)=>{const{data,error}=await sb.rpc(n,a);if(error)throw new Error(error.message);return data};
const msg=e=>ERR[e.message]||"Une erreur est survenue. Réessayez.";
let V={pid:S.get("pid"),code:"",title:"",name:"",err:"",P:null,iv:null,timer:0};
let T={tab:"seances",themeRows:[],thm:null,folder:null,open:null,sumTab:"th",qcms:[],sessions:[],parts:[],docs:[],ed:null,doc:null,iv:null,sel:null};
const stop=()=>{clearInterval(V.iv);clearInterval(T.iv)};
/* ---------- STAGIAIRE ---------- */
function home(){
 stop();V.P=null;
 app.innerHTML=`<h1>QCM PSE</h1><p class="mute">Entrez le code donné par votre formateur.</p>
 <input id="cd" class="bigin" maxlength="6" autocomplete="off" autocapitalize="characters" aria-label="Code de la séance" placeholder="CODE">
 ${V.err?`<p class="sm" style="color:var(--ko)" role="alert">${esc(V.err)}</p>`:""}
 <button class="btn" data-a="code">Continuer</button>
 <p class="sm mute" style="margin-top:28px"><a href="#" data-a="login" style="color:var(--mute)">Espace formateur</a></p>`;
 const i=$("#cd");i.addEventListener("keydown",e=>{if(e.key=="Enter")i.nextElementSibling&&document.querySelector('[data-a="code"]').click()});
}
function nameView(){
 app.innerHTML=`<h1>${esc(V.title)}</h1><p class="mute">Avant d'entrer dans la salle, indiquez votre nom : votre formateur verra vos résultats sous ce nom.</p>
 <label>Prénom et nom</label><input id="nm" autocomplete="name" value="${esc(V.name)}">
 ${V.err?`<p class="sm" style="color:var(--ko)" role="alert">${esc(V.err)}</p>`:""}
 <button class="btn" data-a="join">Entrer dans la salle</button><button class="btn alt" data-a="home">Retour</button>`;
}
function waitView(){
 app.innerHTML=`<h1>Salle d'attente</h1><div class="card"><p><b>${esc(V.name||"Vous êtes inscrit(e)")}</b></p><p class="mute" style="margin:0">${esc(V.title)}<br>Le QCM démarre pour tout le monde dès que le formateur le lance. Restez sur cette page.</p></div>`;
 clearInterval(V.iv);
 V.iv=setInterval(async()=>{try{const s=await rpc("session_status",{p_pid:V.pid});
  if(s.status=="running"){clearInterval(V.iv);V.timer=s.timer||0;startPlay()}
  else if(s.status=="closed"){clearInterval(V.iv);V.err="La séance est terminée.";S.del("pid");V.pid=null;home()}}catch(e){}},2000);
}
async function startPlay(){
 try{const qs=await rpc("get_questions",{p_pid:V.pid});
  V.P={list:qs.map(k=>({...k,ix:shuffle(k.o.map((_,i)=>i))})),i:0,sel:[],ans:{},dl:0,t:0};startQ()}
 catch(e){V.err=msg(e);home()}
}
function startQ(){
 const P=V.P,k=P.list[P.i];clearInterval(V.iv);
 P.t=+k.t||V.timer||0;P.dl=P.t?Date.now()+P.t*1000:0;if(P.t)V.iv=setInterval(tick,250);playView();
}
function tick(){
 const P=V.P;if(!P||!P.dl)return;const ms=P.dl-Date.now(),el=$("#tm");
 if(el){el.textContent=Math.max(0,Math.ceil(ms/1000))+" s";$("#tb").style.width=Math.max(0,ms/(P.t*10))+"%"}
 if(ms<=0)advance();
}
function advance(){
 const P=V.P,k=P.list[P.i];clearInterval(V.iv);
 P.ans[k.i]=P.sel.map(d=>k.ix[d]);P.i++;P.sel=[];P.i<P.list.length?startQ():finish();
}
function playView(){
 const P=V.P,k=P.list[P.i],last=P.i+1==P.list.length;
 app.innerHTML=`<div class="row sm mute"><span>Question ${P.i+1}/${P.list.length}</span>${P.t?`<b id="tm" style="font-size:1.3rem;color:var(--ink)"></b>`:""}</div>
 <div class="bar" style="margin:6px 0 12px"><i id="tb" style="width:${P.t?100:P.i/P.list.length*100}%"></i></div>
 <h2>${esc(k.q)}</h2><p class="sm mute">${k.multi?"Plusieurs réponses possibles":"Une seule réponse"}</p>
 ${k.ix.map((o,d)=>`<button class="opt${P.sel.includes(d)?" sel":""}" data-a="pick" data-d="${d}">${esc(k.o[o])}</button>`).join("")}
 <button class="btn" data-a="valid" ${P.sel.length?"":"disabled"}>${last?"Terminer le QCM":"Valider et continuer"}</button>`;
 tick();
}
async function finish(){
 app.innerHTML=`<p class="mute">Envoi de vos réponses…</p>`;
 try{const r=await rpc("submit_answers",{p_pid:V.pid,p_ans:V.P.ans});S.del("pid");V.pid=null;
  app.innerHTML=`<p class="mute">Résultat</p><div class="score">${r.score}/${r.total}</div><p class="sm mute">Résultat transmis à votre formateur.</p>
  <div class="card"><b>Par thème</b>${themeSum(r.themes)}</div>
  ${diffLine(r.review)?`<p class="sm mute">Par difficulté : ${diffLine(r.review)}</p>`:""}
  <details class="card"><summary style="margin:0">Voir toutes mes réponses (${r.review.length})</summary>${reviewHtml(r.review,"Votre réponse")}</details>
  <button class="btn" data-a="home">Terminer</button>`}
 catch(e){app.innerHTML=`<p>${esc(msg(e))}</p><button class="btn" data-a="home">Retour</button>`}
}
/* ---------- FORMATEUR ---------- */
function loginView(){
 stop();
 app.innerHTML=`<h1>Espace formateur</h1><label>Adresse e-mail</label><input id="em" type="email" autocomplete="username"><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
 ${V.err?`<p class="sm" style="color:var(--ko)" role="alert">${esc(V.err)}</p>`:""}<button class="btn" data-a="signin">Se connecter</button><button class="btn alt" data-a="home">Retour</button>`;
}
async function load(){
 const[q,s,p,d,th]=await Promise.all([sb.from("qcm").select("*").order("created_at"),sb.from("sessions").select("*").order("created_at",{ascending:false}).limit(30),sb.from("participants").select("*").limit(2000),sb.from("docs").select("*").order("created_at",{ascending:false}),sb.from("themes").select("*").order("name")]);
 T.themeRows=th.data||[];
 T.qcms=q.data||[];T.sessions=s.data||[];T.parts=p.data||[];T.docs=d.data||[];
}
async function cleanRandom(){
 for(const q of T.qcms.filter(q=>q.title.startsWith("🎲"))){
  const ss=T.sessions.filter(x=>x.qcm_id==q.id);
  if(ss.length&&ss.every(x=>"title" in x&&x.status=="closed")){await sb.from("qcm").delete().eq("id",q.id);T.qcms=T.qcms.filter(x=>x.id!=q.id)}}
}
async function enter(){
 let r;try{r=await rpc("my_role",{})}catch(e){return trainer()}
 if(r=="formateur")return trainer();
 if(r=="invite")return guest();
 await sb.auth.signOut();V.err="Ce compte n'a pas encore de droits. Contactez le formateur.";loginView();
}
async function gload(){
 const[l,x,pr]=await Promise.all([sb.rpc("invite_qcm_list"),sb.from("sessions").select("*").order("created_at",{ascending:false}).limit(20),sb.rpc("invite_presence")]);
 T.gq=l.data||[];T.sessions=x.data||[];T.gp=pr.data||[];
}
async function guest(){clearInterval(T.iv);await gload();gshell();T.iv=setInterval(async()=>{await gload();gdraw()},3000)}
const gOpts=()=>FOLDERS.map(f=>{const L=(T.gq||[]).filter(q=>folderOf(q)==f);return L.length?`<optgroup label="${FOL[f]}">${L.map(q=>`<option value="${q.id}">${esc(q.title)} (${q.n} q.)</option>`).join("")}</optgroup>`:""}).join("");
function gshell(){
 app.innerHTML=`<div class="row"><h1>Séances</h1><button class="btn alt s" data-a="signout">Déconnexion</button></div><p class="sm mute">Compte invité : vous lancez les QCM préparés par le formateur.</p>
 <h2>Nouvelle séance</h2><div class="card"><label>QCM</label><select id="ns-q">${gOpts()}</select><label>Groupe ou stage</label><input id="ns-g" placeholder="Ex. PSE1 – Octobre"><button class="btn" data-a="glaunch" ${T.gq.length?"":"disabled"}>Générer le code</button></div>
 <h2>Mes séances</h2><div id="list"></div>`;gdraw();
}
function gdraw(){
 const el=$("#list");if(!el)return;
 el.innerHTML=T.sessions.map(s=>{const pr=(T.gp||[]).filter(p=>p.s==s.id),fin=pr.filter(p=>p.finished);
  return`<div class="card"><div class="row"><div><b>${esc(s.title||"QCM")}</b> <span class="tag">${SLAB[s.status]}</span><br><span class="sm mute">${esc(s.group_name)} · ${fmt(s.created_at)}</span></div><div class="code">${esc(s.code)}</div></div>
  <div>${s.status=="lobby"?`<button class="btn s" data-a="gstart" data-id="${s.id}">Démarrer pour tous</button><button class="btn alt s" data-a="gqr" data-id="${s.id}">${T.qr==s.id?"Masquer le QR code":"QR code"}</button>`:""}${s.status!="closed"?`<button class="btn alt s" data-a="gend" data-id="${s.id}">${s.status=="lobby"?"Fermer":"Terminer"}</button>`:""}</div>
  ${T.qr==s.id&&s.status=="lobby"?`<div style="margin-top:10px;text-align:center"><div class="qr" style="background:#fff;display:inline-block;padding:10px;border-radius:10px;width:min(100%,320px)">${qrSvg(joinLink(s.code))||`<p style="color:#000;margin:20px">QR code indisponible : donnez le code.</p>`}</div></div>`:""}
  <p class="sm" style="margin:8px 0 0"><b>${pr.length} présent(s)</b>${s.status!="lobby"?` · ${fin.length} terminé(s)`:""}${pr.length?" : "+pr.map(p=>esc(p.name)+(p.finished?" ✓":"")).join(", "):""}</p></div>`}).join("")||`<p class="mute">Aucune séance.</p>`;
}
async function trainer(){
 clearInterval(T.iv);await load();await cleanRandom();shell();
 T.iv=setInterval(async()=>{if(T.tab!="seances"||T.ed||T.doc)return;await load();await cleanRandom();drawList()},3000);
}
function shell(){
 const N=[["seances","Séances"],["qcm","QCM"],["docs","Documentation"]];
 app.innerHTML=`<div class="row"><h1>Formateur</h1><button class="btn alt s" data-a="signout">Déconnexion</button></div>
 <div class="tabs">${N.map(([k,l])=>`<button data-a="tab" data-v="${k}" ${T.tab==k?'aria-current="true"':""}>${l}</button>`).join("")}</div><div id="pane"></div>`;
 const pane=$("#pane");
 if(T.tab=="seances"){pane.innerHTML=`<h2>Nouvelle séance</h2><div class="card"><label>QCM</label><select id="ns-q">${qOpts()}</select>
  <label>Groupe ou stage</label><input id="ns-g" placeholder="Ex. PSE1 – Octobre"><button class="btn" data-a="launch" ${T.qcms.length?"":"disabled"}>Générer le code</button></div><h2>Mes séances</h2><div id="list"></div>`;drawList()}
 else if(T.tab=="qcm")pane.innerHTML=T.ed?editor():T.gen?genForm():T.thm?themeMgr():T.dup?dupView():qlist();
 else pane.innerHTML=T.doc?docEd():docList();
}
const weak=th=>Object.entries(th||{}).filter(([k,v])=>v[0]/v[1]<.6).map(([k])=>k).join(", ");
function drawList(){
 const el=$("#list");if(!el)return;const LAB={lobby:"Salle ouverte",running:"En cours",closed:"Terminée"};
 el.innerHTML=T.sessions.map(s=>{const q=T.qcms.find(x=>x.id==s.qcm_id),pr=T.parts.filter(p=>p.session_id==s.id),fin=pr.filter(p=>p.finished);
  const avg=fin.length?Math.round(fin.reduce((a,p)=>a+p.score/p.total,0)/fin.length*100):null;
  return`<div class="card"><div class="row"><div><b>${esc(s.title||(q?q.title:"QCM supprimé"))}</b> <span class="tag">${LAB[s.status]}</span><br><span class="sm mute">${esc(s.group_name)} · ${fmt(s.created_at)}</span></div><div class="code">${esc(s.code)}</div></div>
  <div>${s.status=="lobby"?`<button class="btn s" data-a="start" data-id="${s.id}">Démarrer pour tous</button><button class="btn alt s" data-a="qr" data-id="${s.id}">${T.qr==s.id?"Masquer le QR code":"QR code"}</button>`:""}${s.status!="closed"?`<button class="btn alt s" data-a="endsess" data-id="${s.id}">${s.status=="lobby"?"Fermer":"Terminer"}</button>`:""}<button class="btn alt s" data-a="detail" data-id="${s.id}">Résultats</button><button class="btn del s" data-a="delsess" data-id="${s.id}">Supprimer</button></div>
  ${T.qr==s.id&&s.status=="lobby"?`<div style="margin-top:10px;text-align:center"><div class="qr" style="background:#fff;display:inline-block;padding:10px;border-radius:10px;width:min(100%,320px)">${qrSvg(joinLink(s.code))||`<p style="color:#000;margin:20px">QR code indisponible : donnez le code ou le lien.</p>`}</div><p class="sm" style="margin:8px 0 0">Scannez, puis saisissez votre nom.<br><span class="mute">${esc(joinLink(s.code))}</span></p></div>`:""}
  <p class="sm" style="margin:8px 0 0"><b>${pr.length} présent(s)</b>${s.status!="lobby"?` · ${fin.length} terminé(s)`:""}${avg!==null?` · moyenne ${avg} %`:""}${pr.length?" : "+pr.map(p=>esc(p.name)+(p.finished?" ✓":"")).join(", "):""}</p>
  ${T.sel==s.id?`<div style="margin-top:8px">${fin.sort((a,b)=>a.score/a.total-b.score/b.total).map(p=>`<div class="sm" style="margin-bottom:6px"><div class="row"><span>${esc(p.name)}</span><b>${p.score}/${p.total} (${Math.round(p.score/p.total*100)} %)</b></div>${weak(p.themes)?`<span class="mute">À revoir : ${esc(weak(p.themes))}</span><br>`:""}${diffLine(p.review)?`<span class="mute">Par difficulté : ${diffLine(p.review)}</span><br>`:""}<button class="btn alt s" data-a="pdet" data-id="${p.id}">${T.pd==p.id?"Masquer les réponses":"Voir les réponses"}</button>${T.pd==p.id?`<div class="card" style="margin-top:8px"><b>Par thème</b>${themeSum(p.themes)}</div>`:""}${T.pd==p.id?(p.review?reviewHtml(p.review,"Réponse du stagiaire"):`<p class="mute">Détail non disponible pour ce stagiaire.</p>`):""}</div>`).join("")||`<p class="sm mute">Aucun résultat pour l'instant.</p>`}</div>`:""}</div>`}).join("")||`<p class="mute">Aucune séance.</p>`;
}
function joinLink(c){return location.origin+location.pathname+"?code="+encodeURIComponent(c)}
function qrSvg(u){try{if(typeof qrcode=="undefined")return"";const q=qrcode(0,"M");q.addData(u);q.make();return q.createSvgTag(6,2)}catch(e){return""}}
function reviewHtml(rev,who){
 return rev.map((x,n)=>`<div class="card" style="border-left:5px solid var(${x.good?"--ok":"--ko"})"><div class="row"><b>${n+1}. ${esc(x.q)}</b><span class="tag">${x.good?"Juste":"Faux"}</span></div>
 ${x.o.map((t,i)=>{const c=x.a.includes(i),k=x.s.includes(i);
  const m=c&&k?["✓",who+" (juste)","--ok"]:c?["✓","Bonne réponse oubliée","--ok"]:k?["✗",who+" (fausse)","--ko"]:["·","","--mute"];

 if(a=="signout"){await sb.auth.signOut();return home()}
 if(a=="tab"){T.tab=b.dataset.v;T.ed=T.doc=T.gen=T.thm=T.dup=null;return shell()}
 if(a=="glaunch"){const g=$("#ns-g").value.trim(),q=T.gq.find(x=>x.id==$("#ns-q").value);if(!g||!q)return alert("Indiquez un groupe.");
  if(await run(sb.from("sessions").insert({qcm_id:q.id,group_name:g,title:q.title})))await gload();return gshell()}
 if(a=="gstart"){if(!confirm("Lancer le QCM pour tous les stagiaires présents ?"))return;
  await run(sb.from("sessions").update({status:"running",started_at:new Date().toISOString()}).eq("id",id));await gload();return gdraw()}
 if(a=="gend"){await run(sb.from("sessions").update({status:"closed"}).eq("id",id));await gload();return gdraw()}
 if(a=="gqr"){T.qr=T.qr==id?null:id;return gdraw()}
 if(a=="launch"){const g=$("#ns-g").value.trim();if(!g)return alert("Indiquez un groupe.");
  if(await run(sb.from("sessions").insert({qcm_id:$("#ns-q").value,group_name:g,title:(T.qcms.find(x=>x.id==$("#ns-q").value)||{}).title})))await load();return shell()}
 if(a=="start"){if(!confirm("Lancer le QCM pour tous les stagiaires présents ?"))return;
  await run(sb.from("sessions").update({status:"running",started_at:new Date().toISOString()}).eq("id",id));await load();return drawList()}
 if(a=="endsess"){await run(sb.from("sessions").update({status:"closed"}).eq("id",id));await load();await cleanRandom();return drawList()}
 if(a=="pdet"){T.pd=T.pd==id?null:id;return drawList()}
 if(a=="qr"){T.qr=T.qr==id?null:id;return drawList()}
 if(a=="detail"){T.sel=T.sel==id?null:id;return drawList()}
 if(a=="delsess"){if(confirm("Supprimer cette séance et ses résultats ?")){await run(sb.from("sessions").delete().eq("id",id));await load();drawList()}return}
 if(a=="newq"){T.ed={title:"",level:T.folder||"PSE1",timer:0,qs:[blankK()]};T.open=0;T.sumTab="th"}
 else if(a=="editq"){T.ed=JSON.parse(JSON.stringify(T.qcms.find(x=>x.id==id)));T.ed.level=folderOf(T.ed);T.open=null;T.sumTab="th"}
 else if(a=="openk")T.open=T.open===+b.dataset.i?null:+b.dataset.i;
 else if(a=="sumtab")T.sumTab=b.dataset.v;
 else if(a=="openfol")T.folder=b.dataset.v;
 else if(a=="backfol")T.folder=null;
 else if(a=="dupq"){const q=T.qcms.find(x=>x.id==id);await run(sb.from("qcm").insert({title:q.title+" (copie)",level:q.level,timer:q.timer,qs:q.qs}));await load()}
 else if(a=="delq"){if(confirm("Supprimer ce QCM ?")){await run(sb.from("qcm").delete().eq("id",id));await load()}}
 else if(a=="addk"){E.qs.push(blankK());T.open=E.qs.length-1}
 else if(a=="delk"){E.qs.splice(+b.dataset.i,1);T.open=null}
 else if(a=="addo")E.qs[+b.dataset.i].o.push("");
 else if(a=="delo"){const k=E.qs[+b.dataset.i],j=+b.dataset.j;k.o.splice(j,1);k.a=k.a.filter(x=>x!=j).map(x=>x>j?x-1:x)}
 else if(a=="saveq"){
  if(!E.title.trim())return alert("Donnez un titre au QCM.");
  for(const k of E.qs){const keep=k.o.map((x,i)=>x.trim()?i:-1).filter(i=>i>=0);k.a=k.a.filter(i=>keep.includes(i)).map(i=>keep.indexOf(i));k.o=keep.map(i=>k.o[i].trim());
   if(!k.q.trim()||k.o.length<2||!k.a.length)return alert("Chaque question doit avoir un énoncé, au moins 2 réponses remplies et une bonne réponse cochée.")}
  if(E.qs.some((_,i)=>dupWarn(i))&&!confirm("Certaines questions ressemblent à des questions déjà présentes. Enregistrer quand même ?"))return;
  const row={title:E.title,level:E.level,timer:E.timer||0,qs:E.qs};
  if(await run(E.id?sb.from("qcm").update(row).eq("id",E.id):sb.from("qcm").insert(row))){T.ed=null;await load()}else return}
 else if(a=="newgen")T.gen={title:"🎲 Examen blanc",level:"PSE1",count:20,mix:"alea",nf:5,nm:5,nd:2,src:preselect("PSE1")};
 else if(a=="gen"){const g=T.gen,all=gather(g);let title=g.title.trim();
  const want=g.mix=="perso"?g.nf+g.nm+g.nd:g.count;
  if(!title)return alert("Donnez un titre.");if(!all.length||want<1)return alert("Choisissez au moins un QCM source et un nombre de questions.");
  const d=draw(all,g),n=d.picks.length;
  if(n<want&&!confirm("Seulement "+n+" questions disponibles sur "+want+" demandées. Continuer avec "+n+" ?"))return;
  if(!title.startsWith("🎲"))title="🎲 "+title;
  const qs=JSON.parse(JSON.stringify(d.picks));
  if(await run(sb.from("qcm").insert({title,level:g.level=="Tous"?"PSE1 + PSE2":g.level,timer:0,qs}))){T.gen=null;await load();alert("QCM créé avec "+n+" questions. Il sera supprimé automatiquement une fois la séance terminée.\nThèmes : "+sumText(qs)+"\nDifficulté : "+sumText(qs,"d")+(d.fill?"\n("+d.fill+" question(s) prise(s) dans un autre niveau, faute de questions au niveau demandé.)":""))}else return}
 else if(a=="themes")T.thm=true;
 else if(a=="dups")T.dup=true;
 else if(a=="rmq"){const q=T.qcms.find(x=>x.id==id),x=+b.dataset.x;
  if(q.qs.length<=1)return alert("Un QCM doit garder au moins une question.");
  if(!confirm("Retirer cette question de « "+q.title+" » ?"))return;
  if(await run(sb.from("qcm").update({qs:q.qs.filter((_,i)=>i!=x)}).eq("id",id)))await load();else return}
 else if(a=="addtheme"){const n=$("#nt").value.trim();if(!n)return;
  if(allThemes().some(x=>x.toLowerCase()==n.toLowerCase()))return alert("Ce thème existe déjà.");
  if(await run(sb.from("themes").insert({name:n})))await load();else return}
 else if(a=="rnth")await renameTheme(b.dataset.n);
 else if(a=="delth")await deleteTheme(b.dataset.n);
 else if(a=="cancel")T.ed=T.doc=T.gen=T.thm=T.dup=null;
 else if(a=="newd")T.doc={title:"",cat:"",body:"",url:"",file_path:null,file_name:null};
 else if(a=="editd"){T.doc={...T.docs.find(x=>x.id==id)};T.doc._orig=T.doc.file_path}
 else if(a=="rmf")T.doc.file_path=T.doc.file_name=null;
 else if(a=="saved"){const d=T.doc;if(!d.title.trim())return alert("Donnez un titre.");
  const f=($("#df")||{}).files&&$("#df").files[0];if(f&&f.size>20*1024*1024)return alert("Fichier trop volumineux (20 Mo maximum).");
  const label=b.textContent;b.disabled=true;
  if(f){b.textContent="Envoi du fichier…";const path=Date.now()+"-"+f.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9._-]+/g,"_");
   const up=await sb.storage.from("documents").upload(path,f);
   if(up.error){b.disabled=false;b.textContent=label;return alert("Envoi impossible : "+up.error.message)}
   d.file_path=path;d.file_name=f.name}
  const row={title:d.title,cat:d.cat,body:d.body,url:d.url,file_path:d.file_path||null,file_name:d.file_name||null};
  const ok=await run(d.id?sb.from("docs").update(row).eq("id",d.id):sb.from("docs").insert(row));
  if(!ok){b.disabled=false;b.textContent=label;return}
  if(d._orig&&d._orig!=row.file_path)await sb.storage.from("documents").remove([d._orig]);
  T.doc=null;await load()}
 else if(a=="deld"){if(confirm("Supprimer ce document ?")){const d=T.docs.find(x=>x.id==id);await run(sb.from("docs").delete().eq("id",id));if(d&&d.file_path)await sb.storage.from("documents").remove([d.file_path]);await load()}}
 else return;
 shell();
});
(async()=>{
 if(!sb)return;
 if(V.pid){try{const s=await rpc("session_status",{p_pid:V.pid});V.title=s.title;V.timer=s.timer||0;
  if(!s.finished&&s.status=="lobby")return waitView();if(!s.finished&&s.status=="running")return startPlay()}catch(e){}
  S.del("pid");V.pid=null}
 const c=(new URLSearchParams(location.search).get("code")||"").trim().toUpperCase();
 if(c){try{const r=await rpc("check_code",{p_code:c});V.code=c;V.title=r.title;return nameView()}catch(e){V.err=msg(e)}}
 home();
})();
</script>
